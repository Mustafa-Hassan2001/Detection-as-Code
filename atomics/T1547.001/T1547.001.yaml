attack_technique: T1547.001
display_name: 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
atomic_tests:
- name: DAC - HKCU Run key pointing to C:\Users\Public
  auto_generated_guid: d3272de4-c11c-40b0-b287-56a3eacbc33a
  description: |
    Writes an HKCU Run value pointing to a (non-existent) binary in C:\Users\Public. Requires
    a Sysmon config that logs Run-key writes (EID 13) - SwiftOnSecurity and sysmon-modular
    both do. Triggers: registry_set_win_run_key_suspicious_path.
  supported_platforms:
  - windows
  input_arguments:
    value_name:
      description: Run value name
      type: string
      default: DACTest
  executor:
    command: |
      reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v #{value_name} /t REG_SZ /d "C:\Users\Public\dac-test.exe" /f
    cleanup_command: |
      reg delete "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v #{value_name} /f >nul 2>&1
    name: command_prompt
    elevation_required: false
