# yamllint configuration (https://yamllint.readthedocs.io). Catches YAML-level problems
# (tabs, duplicate keys, bad indentation) before the Sigma parser sees the file.
extends: default
rules:
  line-length:
    max: 160
    level: warning
  document-start: disable        # Sigma / ART files conventionally omit '---'
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false            # GitHub Actions uses the key 'on'
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
  key-duplicates: enable
