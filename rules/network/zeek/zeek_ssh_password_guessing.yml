title: SSH Session With Many Authentication Attempts
id: 104ba47b-fdb1-4470-8c95-51b124143e96
status: test
description: |
  Detects SSH connections in Zeek ssh.log where the server saw five or more
  authentication attempts within a single connection - the pattern of password guessing
  tools that reuse one TCP connection up to the server's MaxAuthTries limit. Zeek infers
  attempts from the encrypted packet-size heuristics, so the count is an estimate. Tools
  that open a new connection per password evade this single-event rule; the aggregation
  (correlation) version is listed as future work.
references:
  - https://attack.mitre.org/techniques/T1110/001/
  - https://docs.zeek.org/en/master/scripts/base/protocols/ssh/main.zeek.html
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1110.001/T1110.001.md
author: Syed Mustafa Hassan
date: 2026-10-29
tags:
  - attack.credential-access
  - attack.t1110.001
logsource:
  product: zeek
  service: ssh
detection:
  selection:
    auth_attempts|gte: 5
  condition: selection
falsepositives:
  - Clients that offer many keys from an SSH agent before the right one (each rejected key counts as an attempt). Set IdentitiesOnly=yes on admin hosts or raise the threshold.
level: medium
