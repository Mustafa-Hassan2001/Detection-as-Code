title: LSASS Memory Dump via comsvcs.dll MiniDump
id: c1db81e8-e5e6-486c-a565-ec94f5027dd3
status: test
description: |
  Detects rundll32.exe calling the MiniDump export of comsvcs.dll (by name or by its
  ordinal #24). This is a well-known "living off the land" way to write a full memory
  dump of a process - in practice almost always lsass.exe - so that credentials can be
  extracted offline with tools such as Mimikatz or pypykatz. It complements the
  process-access rule because it fires on the command line even if Sysmon event ID 10
  is not collected.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://lolbas-project.github.io/lolbas/Libraries/Comsvcs/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.001/T1003.001.md
  - https://github.com/SigmaHQ/sigma/blob/05d1031f537e830b76da53bae2400c5814c89165/rules/windows/process_creation/proc_creation_win_rundll32_process_dump_via_comsvcs.yml
author: 'Syed Mustafa Hassan (adaptation); original SigmaHQ rule(s) by Florian Roth (Nextron Systems), Modexp, Nasreddine Bencherchali (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron Systems)'
date: 2026-10-29
license: DRL-1.1
related:
  - id: 646ea171-dded-4578-8a4d-65e9822892e3
    type: derived
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\rundll32.exe'
    - OriginalFileName: 'RUNDLL32.EXE'
  selection_dll:
    CommandLine|contains: 'comsvcs'
  selection_func:
    CommandLine|contains:
      - 'MiniDump'
      - '#24'
      - '#+24'
  condition: all of selection_*
falsepositives:
  - Very unlikely. Some crash-diagnostics tooling has used this technique; confirm with the owning team before allow-listing.
level: high
