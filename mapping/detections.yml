# Attack-to-detection mapping: the single source of truth that ties each Sigma rule to
#   - the ATT&CK technique(s) it detects (must equal the rule's attack.tXXXX tags),
#   - the emulation (atomic test) that should trigger it,
#   - the log source / telemetry it needs (and how to collect it in the lab),
#   - the synthetic sample events it must (and must not) match.
#
# Consumers:
#   tools/validate_rules.py  - consistency between this file, the rules, atomics and samples
#   tools/test_rules.py      - runs every rule against sample_data.file and compares hits
#                              with expected_matches (+ known_false_positives)
#   tools/coverage.py        - ATT&CK Navigator layer + Markdown coverage summary
#
# Field reference (see docs/mapping-schema.md for the full description):
#   rule                      path of the Sigma rule
#   rule_id                   the rule's UUID (guards against copy/paste errors)
#   lab_validation            outcome of the emulation in the SecureNet Lab:
#                             not-run | fired | not-fired | partial  (you fill this in)
#   techniques                ATT&CK technique IDs, pinned to attack_version
#   log_source.sigma          the rule's Sigma logsource (checked against the rule)
#   log_source.telemetry      concrete event type required
#   log_source.collection     how the SecureNet Lab collects it
#   emulation.atomic          atomics/<technique>/<technique>.yaml (Atomic Red Team format)
#   emulation.test            test name inside that file
#   emulation.upstream        closest upstream Atomic Red Team test (verify with
#                             `Invoke-AtomicTest <T#> -ShowDetailsBrief` at the pinned ART commit)
#   sample_data.file          synthetic log file the rule is tested against
#   sample_data.expected_matches     sample IDs the rule MUST match (true positives)
#   sample_data.known_false_positives benign sample IDs the rule is EXPECTED to match
#                                     (documented FP; keeps FP accounting honest)

